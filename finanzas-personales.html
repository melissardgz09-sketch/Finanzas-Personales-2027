<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --text:#1a1a1a; --muted:#6b6b6b;
  --border:#e5e3df; --accent:#2f6f4f; --accent2:#c0392b; --pill:#eef2ee;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161615; --card:#1f1f1e; --text:#f1efec; --muted:#a3a19c;
    --border:#333230; --accent:#5fae84; --accent2:#e07a6a; --pill:#26302a;
  }
}
:root[data-theme="dark"]{
  --bg:#161615; --card:#1f1f1e; --text:#f1efec; --muted:#a3a19c;
  --border:#333230; --accent:#5fae84; --accent2:#e07a6a; --pill:#26302a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:16px; max-width:520px; margin-inline:auto;
}
h1{font-size:1.3rem; margin:4px 0 16px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px;}
.summary{display:flex; justify-content:space-between; gap:10px; text-align:center;}
.summary div{flex:1;}
.summary .label{font-size:.75rem; color:var(--muted);}
.summary .value{font-size:1.15rem; font-weight:600; margin-top:2px;}
.cur-block{margin-bottom:12px;}
.cur-block:last-child{margin-bottom:0;}
.cur-title{font-size:.78rem; color:var(--muted); font-weight:600; margin-bottom:6px;}
.balance-pos{color:var(--accent);} .balance-neg{color:var(--accent2);}
form{display:flex; flex-wrap:wrap; gap:8px;}
input,select{
  flex:1 1 120px; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:.95rem; min-width:0;
}
button{
  padding:9px 16px; border-radius:9px; border:none; background:var(--accent);
  color:#fff; font-weight:600; cursor:pointer; font-size:.95rem;
}
.cancel-edit{background:var(--pill); color:var(--text); font-weight:500;}
.edit{background:none; border:none; color:var(--muted); font-size:1rem; padding:0 4px; cursor:pointer;}
.type-toggle{display:flex; gap:6px; width:100%;}
.type-toggle button{flex:1; background:var(--pill); color:var(--text); font-weight:500;}
.type-toggle button.active{background:var(--accent); color:#fff;}
.tag{font-size:.68rem; padding:2px 7px; border-radius:20px; background:var(--pill); color:var(--muted); margin-left:6px;}
.tag.biz{background:#e9dfc9; color:#7a5b12;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.biz{background:#3a331d; color:#e0b95c;} }
:root[data-theme="dark"] .tag.biz{background:#3a331d; color:#e0b95c;}
.filters{display:flex; gap:6px; margin-bottom:10px;}
.filters button{flex:1; background:var(--pill); color:var(--text); font-weight:500; padding:8px; font-size:.85rem;}
.filters button.active{background:var(--text); color:var(--card);}
ul{list-style:none; padding:0; margin:0; max-height:260px; overflow-y:auto;}
li{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:.92rem;}
li:last-child{border-bottom:none;}
li .meta{color:var(--muted); font-size:.78rem;}
.amt-in{color:var(--accent);} .amt-out{color:var(--accent2);} .amt-invest{color:#b8860b; font-weight:600;}
.amt-in,.amt-out{font-weight:600;}
.cat-row{display:flex; align-items:center; gap:8px; margin:8px 0; font-size:.88rem;}
.cat-row .bar-bg{flex:1; background:var(--pill); border-radius:6px; height:9px; overflow:hidden;}
.cat-row .bar-fill{height:100%; background:var(--accent2); border-radius:6px;}
.empty{color:var(--muted); font-size:.9rem; text-align:center; padding:12px 0;}
.del{background:none; border:none; color:var(--muted); font-size:1rem; padding:0 4px; cursor:pointer;}
</style>
</head>
<body>
<h1>💰 Mis Finanzas</h1>

<div class="filters">
  <button type="button" class="active" data-filter="all">Todo</button>
  <button type="button" data-filter="personal">Personal</button>
  <button type="button" data-filter="negocio">🚀 Negocio</button>
</div>

<div class="card" id="summaryCard"></div>

<div class="card">
  <form id="form">
    <div class="type-toggle">
      <button type="button" id="btnIn" class="active">Ingreso</button>
      <button type="button" id="btnOut">Gasto</button>
      <button type="button" id="btnInvest">Inversión</button>
    </div>
    <div class="type-toggle">
      <button type="button" id="btnPersonal" class="active">Personal</button>
      <button type="button" id="btnNegocio">🚀 Negocio</button>
    </div>
    <input id="desc" placeholder="Descripción" required>
    <input id="amount" type="number" step="0.01" min="0" placeholder="Monto" required>
    <select id="currency">
      <option value="USD">USD $</option>
      <option value="COP">COP $</option>
    </select>
    <select id="category">
      <option>Comida</option><option>Transporte</option><option>Vivienda</option>
      <option>Ocio</option><option>Salud</option><option>Salario</option>
      <option>Ventas</option><option>Inversión</option><option>Marketing</option>
      <option>Proveedores</option><option>Herramientas</option><option>Otro</option>
    </select>
    <button type="submit" id="submitBtn">Agregar</button>
    <button type="button" id="cancelEdit" class="cancel-edit" style="display:none">Cancelar</button>
  </form>
</div>

<div class="card">
  <strong>Gastos por categoría</strong>
  <div id="categories"><div class="empty">Aún no hay gastos</div></div>
</div>

<div class="card">
  <strong>Movimientos</strong>
  <ul id="list"><li class="empty">Aún no hay movimientos</li></ul>
</div>

<script>
let type = 'in';
let sector = 'personal';
let filter = 'all';
let data = [];
let editingIndex = null;
const fmt = (n,cur='USD') => (cur==='COP' ? 'COP $' : '$') + n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

async function load(){
  try{
    const saved = localStorage.getItem('finanzas_data');
    data = saved ? JSON.parse(saved) : [];
  }catch(e){ data = []; }
  render();
}
function save(){
  try{ localStorage.setItem('finanzas_data', JSON.stringify(data)); }catch(e){}
}

document.getElementById('btnIn').onclick = ()=>{ type='in'; toggleBtn(); };
document.getElementById('btnOut').onclick = ()=>{ type='out'; toggleBtn(); };
document.getElementById('btnInvest').onclick = ()=>{ type='invest'; toggleBtn(); };
function toggleBtn(){
  document.getElementById('btnIn').classList.toggle('active', type==='in');
  document.getElementById('btnOut').classList.toggle('active', type==='out');
  document.getElementById('btnInvest').classList.toggle('active', type==='invest');
}
document.getElementById('btnPersonal').onclick = ()=>{ sector='personal'; toggleSector(); };
document.getElementById('btnNegocio').onclick = ()=>{ sector='negocio'; toggleSector(); };
function toggleSector(){
  document.getElementById('btnPersonal').classList.toggle('active', sector==='personal');
  document.getElementById('btnNegocio').classList.toggle('active', sector==='negocio');
}
document.querySelectorAll('.filters button').forEach(btn=>{
  btn.onclick = ()=>{
    filter = btn.dataset.filter;
    document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active', b===btn));
    render();
  };
});

document.getElementById('form').addEventListener('submit', e=>{
  e.preventDefault();
  const desc = document.getElementById('desc').value.trim();
  const amount = parseFloat(document.getElementById('amount').value);
  const category = document.getElementById('category').value;
  const currency = document.getElementById('currency').value;
  if(!desc || !amount || amount<=0) return;
  if(editingIndex !== null){
    data[editingIndex] = { ...data[editingIndex], desc, amount, category, type, sector, currency };
    editingIndex = null;
    document.getElementById('submitBtn').textContent = 'Agregar';
    document.getElementById('cancelEdit').style.display = 'none';
  } else {
    data.unshift({ desc, amount, category, type, sector, currency, date: new Date().toISOString() });
  }
  save(); render();
  e.target.reset();
  toggleBtn(); toggleSector();
});

document.getElementById('cancelEdit').onclick = ()=>{
  editingIndex = null;
  document.getElementById('form').reset();
  document.getElementById('submitBtn').textContent = 'Agregar';
  document.getElementById('cancelEdit').style.display = 'none';
  toggleBtn(); toggleSector();
};

function editItem(idx){
  const d = data[idx];
  editingIndex = idx;
  document.getElementById('desc').value = d.desc;
  document.getElementById('amount').value = d.amount;
  document.getElementById('category').value = d.category;
  document.getElementById('currency').value = d.currency || 'USD';
  type = d.type; sector = d.sector || 'personal';
  toggleBtn(); toggleSector();
  document.getElementById('submitBtn').textContent = 'Guardar cambios';
  document.getElementById('cancelEdit').style.display = 'inline-block';
  document.getElementById('form').scrollIntoView({behavior:'smooth'});
}

function removeItem(idx){
  data.splice(idx,1); save(); render();
}

function render(){
  const view = filter==='all' ? data : data.filter(d=>d.sector===filter);
  const currencies = [...new Set(view.map(d=>d.currency||'USD'))];
  const summaryCard = document.getElementById('summaryCard');
  if(currencies.length===0){
    summaryCard.innerHTML = '<div class="empty">Aún no hay movimientos</div>';
  } else {
    summaryCard.innerHTML = currencies.map(cur=>{
      const rows = view.filter(d=>(d.currency||'USD')===cur);
      const totalIn = rows.filter(d=>d.type==='in').reduce((s,d)=>s+d.amount,0);
      const totalOut = rows.filter(d=>d.type==='out').reduce((s,d)=>s+d.amount,0);
      const totalInvest = rows.filter(d=>d.type==='invest').reduce((s,d)=>s+d.amount,0);
      const bal = totalIn - totalOut - totalInvest;
      return `<div class="cur-block">
        <div class="cur-title">${cur}</div>
        <div class="summary">
          <div><div class="label">Ingresos</div><div class="value amt-in">${fmt(totalIn,cur)}</div></div>
          <div><div class="label">Gastos</div><div class="value amt-out">${fmt(totalOut,cur)}</div></div>
        </div>
        <div class="summary" style="margin-top:8px">
          <div><div class="label">Inversión</div><div class="value amt-invest">${fmt(totalInvest,cur)}</div></div>
          <div><div class="label">Ganancia</div><div class="value ${bal>=0?'balance-pos':'balance-neg'}">${fmt(bal,cur)}</div></div>
        </div>
      </div>`;
    }).join('');
  }

  const list = document.getElementById('list');
  list.innerHTML = '';
  if(view.length===0){ list.innerHTML = '<li class="empty">Aún no hay movimientos</li>'; }
  view.forEach(d=>{
    const idx = data.indexOf(d);
    const li = document.createElement('li');
    const date = new Date(d.date).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    const bizTag = d.sector==='negocio' ? '<span class="tag biz">🚀 Negocio</span>' : '';
    li.innerHTML = `<span>${d.desc}${bizTag}<div class="meta">${d.category} · ${date}</div></span>
      <span>
        <span class="${d.type==='in'?'amt-in':(d.type==='invest'?'amt-invest':'amt-out')}">${d.type==='in'?'+':'-'}${fmt(d.amount,d.currency)}</span>
        <button class="edit" onclick="editItem(${idx})">✎</button>
        <button class="del" onclick="removeItem(${idx})">✕</button>
      </span>`;
    list.appendChild(li);
  });

  const catDiv = document.getElementById('categories');
  if(currencies.length===0){
    catDiv.innerHTML = '<div class="empty">Aún no hay gastos</div>';
  } else {
    catDiv.innerHTML = currencies.map(cur=>{
      const cats = {};
      view.filter(d=>d.type!=='in' && (d.currency||'USD')===cur).forEach(d=>{ cats[d.category]=(cats[d.category]||0)+d.amount; });
      const entries = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
      if(entries.length===0) return '';
      const max = Math.max(...entries.map(e=>e[1]));
      return `<div class="cur-title">${cur}</div>` + entries.map(([cat,val])=>`
        <div class="cat-row">
          <span style="min-width:80px">${cat}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${(val/max*100)}%"></div></div>
          <span style="min-width:70px;text-align:right">${fmt(val,cur)}</span>
        </div>`).join('');
    }).join('') || '<div class="empty">Aún no hay gastos</div>';
  }
}

load();
</script>
</body>
</html>
